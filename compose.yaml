services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: socratescode
      POSTGRES_PASSWORD: socratescode_local
      POSTGRES_DB: socratescode
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["socrates-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socratescode"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  socrates-postgres:
