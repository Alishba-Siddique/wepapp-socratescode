name: Roll back production
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Previous successful production deployment URL, copied from release evidence
        required: true
        type: string
permissions:
  contents: read
jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: production-release
      cancel-in-progress: false
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate rollback target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-policy.mjs ownership
      - name: Restore previous production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/vercel-release.mjs rollback
      - name: Verify production after rollback
        env:
          DEPLOYMENT_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke.mjs
