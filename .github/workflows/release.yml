name: Verified production release
on:
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
    inputs:
      commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: Staging
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_SHA: ${{ inputs.commit }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ops/package-lock.json
      - name: Build candidate without assigning production domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node scripts/release-policy.mjs environment
          node scripts/vercel-release.mjs candidate > "$RUNNER_TEMP/deployment-url.txt"
          node scripts/release-policy.mjs capture "$RUNNER_TEMP/deployment-url.txt"
      - name: Verify project ownership and smoke-test candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node scripts/release-policy.mjs ownership
          node scripts/smoke.mjs
      - name: Verify the deployed learning journey
        env:
          WEB_APP_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-results/candidate
        run: |
          npm ci --prefix frontend
          npm exec --prefix frontend -- playwright install --with-deps chromium
          node frontend/tests/browser.mjs
          node frontend/tests/learning-browser.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-evidence-${{ inputs.commit }}-${{ github.run_attempt }}
          path: |
            release.json
            test-results/
          retention-days: 30
          if-no-files-found: warn
  promote:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: production-release
      cancel-in-progress: false
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DEPLOYMENT_URL: ${{ needs.candidate.outputs.url }}
      RELEASE_SHA: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Reject obsolete or unrelated releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node scripts/release-policy.mjs current-main
          node scripts/release-policy.mjs ownership
      - name: Promote the verified candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/vercel-release.mjs promote
      - name: Verify the public production URL
        env:
          DEPLOYMENT_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke.mjs
      - name: Record release
        run: |
          printf '### Production release\nCommit: %s\nCandidate: %s\n' "$RELEASE_SHA" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
